[project]
name = "hhs-dab-collect-sort"
version = "0.1.0"
description = "Collect and sort HHS Departmental Appeals Board decisions"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Only needed for `extract.py --ocr`, which also wants the tesseract binary.
ocr = ["pymupdf>=1.24", "pytesseract>=0.3", "pillow>=10.0"]

[tool.setuptools]
py-modules = [
    "archive", "audit_completeness", "build_dataset", "build_manifests",
    "categories", "categorize_counts", "clean", "collect_index", "extract",
    "fetch_missing", "jsonl", "label", "metadata", "slice_jsonl",
]

[dependency-groups]
dev = ["pytest>=8.0", "pymupdf>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
