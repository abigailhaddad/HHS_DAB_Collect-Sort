name: daily collection

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Rebuilds the Board's published index from the Internet Archive every day,
# refuses to accept a smaller one than last time, tops the current year up
# live (a real, launched Chrome -- confirmed against hhs.gov directly that
# Akamai's block here doesn't need a human-started one, unlike Cloudflare's
# deeper fingerprinting; see collect_index.py's docstring), then fetches
# whatever that finds that the corpus doesn't have yet, rebuilds it, pushes
# to Hugging Face, and redeploys the site.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y xvfb

      # The suite first: a broken parser should fail here, not halfway through
      # a collection run.
      - run: python run_checks.py
      - run: python -m pytest tests/ -q

      - name: Rebuild the published index, topped up live
        run: xvfb-run -a python collect_index.py --out decisions_index.jsonl --launch-browser

      - name: Fail if any division-year lost decisions
        run: python check_index.py decisions_index.jsonl --baseline index_baseline.json

      # Non-fatal, and should rarely fire now that the top-up above runs
      # daily -- kept as a safety net in case a run's live fetch fails
      # quietly for one year while still passing overall.
      - name: Warn if the current year's Archive snapshot has gone stale
        run: python check_snapshot_age.py --max-age-days 21

      # Fold the new counts into the baseline and commit it, so a gain is
      # reported once rather than every day until someone does it by hand.
      # Safe to baseline the --launch-browser count now, unlike a --cdp run:
      # this IS the reproducible daily method, run the same way every time.
      - name: Record the new baseline
        run: |
          python check_index.py decisions_index.jsonl \
            --baseline index_baseline.json --update
          if ! git diff --quiet index_baseline.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index_baseline.json
            git commit -m "Baseline: newly published decisions [skip ci]"
            git push
          else
            echo "baseline unchanged"
          fi

      # Diffs the index against the published corpus, fetches anything
      # missing (Archive first, live browser for whatever the Archive
      # doesn't have yet), rebuilds the affected parquet files, and pushes
      # the result to Hugging Face. See daily_update.py's own docstring for
      # the full step-by-step.
      - name: Fetch new decisions and update the published corpus
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: xvfb-run -a python daily_update.py --index decisions_index.jsonl --launch-browser

      - name: Deploy the site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d35a64188257cbb8177a48e907e28171
        run: npx wrangler deploy

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: decisions-index
          path: |
            decisions_index.jsonl
            decisions_index.meta.json
          retention-days: 14
