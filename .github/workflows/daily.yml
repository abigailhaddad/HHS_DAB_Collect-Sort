name: daily collection

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

# Rebuilds the Board's published index from the Internet Archive every day and
# refuses to accept a smaller one than last time. Every failure this repo has
# had looked like a clean empty result -- a pattern that stopped matching, a
# year that parsed to zero -- so the scheduled job's job is to notice that.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      # The suite first: a broken parser should fail here, not halfway through
      # a collection run.
      - run: python run_checks.py
      - run: python -m pytest tests/ -q

      - name: Rebuild the published index
        run: python collect_index.py --out decisions_index.jsonl

      - name: Fail if any division-year lost decisions
        run: python check_index.py decisions_index.jsonl --baseline index_baseline.json

      # Non-fatal: the Archive's crawl schedule isn't this collector's bug to
      # fail on, but a snapshot that goes stale for months is exactly what let
      # 179 published decisions sit invisible until someone happened to look.
      - name: Warn if the current year's Archive snapshot has gone stale
        run: python check_snapshot_age.py --max-age-days 21

      # Fold the new decisions into the baseline and commit it, so a gain is
      # reported once rather than every day until someone does it by hand. The
      # update merges, so a year that could not be fetched keeps its old count
      # rather than being zeroed.
      - name: Record the new baseline
        run: |
          python check_index.py decisions_index.jsonl \
            --baseline index_baseline.json --update
          if ! git diff --quiet index_baseline.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index_baseline.json
            git commit -m "Baseline: newly published decisions [skip ci]"
            git push
          else
            echo "baseline unchanged"
          fi

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: decisions-index
          path: |
            decisions_index.jsonl
            decisions_index.meta.json
          retention-days: 14
